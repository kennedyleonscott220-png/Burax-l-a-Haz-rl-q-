function TB(s,tp,ty='q'){let r=[];FT.filter(t=>t[0]==s&&(!tp||t[1]==tp)&&(ty!='k'||t[4])).forEach(t=>{let pool=[...new Set([...t[2].map(p=>p[1]),...(t[3]||[])])];t[2].forEach(p=>{let it={s,t:t[1],ty,q:p[0]};if(ty=='k')it.a=+p[1];else if(ty=='y'){it.q='Yazılı cavab verin: '+p[0];it.a=p[1]}else{let o=sh([p[1],...sh(pool.filter(v=>v!=p[1])).slice(0,4)]);it.a=o.indexOf(p[1]);it.o=o.map(String)}r.push(it)})});return r}

function goalCard(){let G=LS.g('goal',{d:{},ex:'',g:30}),td=new Date().toISOString().slice(0,10),sk=0;for(let i=0;i<400;i++){let d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);if((G.d[d]||0)>=G.g)sk++;else if(i)break}let dl=G.ex?Math.ceil((new Date(G.ex)-Date.now())/864e5):null;return`<div class="card"><b>Gündəlik hədəf</b><p>Bu gün: <b>${G.d[td]||0}</b> / ${G.g} sual · ardıcıl gün: <b>${sk}</b></p><p class="m">İmtahan tarixi: <input type="date" style="width:auto" value="${G.ex}" onchange="let g=LS.g('goal',{d:{},ex:'',g:30});g.ex=this.value;LS.s('goal',g);home()"> ${dl!=null?(dl>=0?dl+' gün qalıb':'tarix keçib'):''}</p></div>`}
function mastery(){let r=Object.entries(LS.g('ms',{})).filter(([k,v])=>v[1]>=3).map(([k,v])=>[k.replace('|',' · '),Math.round(100*v[0]/v[1]),v[1]]).sort((a,b)=>a[1]-b[1]);return r.length?`<table>${r.slice(0,8).map(x=>`<tr><td>${x[0]}</td><td><span class="bar" style="width:${x[1]}px"></span> ${x[1]}%</td><td class="m">${x[2]} sual</td></tr>`).join('')}</table><button onclick="weak()">Zəif mövzulardan test</button>`:''}
function weakSmartCard(){
 let ms=LS.g('ms',{}),wrong=LS.g('wrong',[]),rows=Object.entries(ms).filter(([k,v])=>Array.isArray(v)&&v[1]>=2).map(([k,v])=>{let z=k.split('|'),attempt=Number(v[1])||0,correct=Number(v[0])||0,rate=attempt?Math.round(100*correct/attempt):0,bad=Math.max(0,attempt-correct),saved=wrong.filter(x=>x.s===z[0]&&x.t===z[1]).length;return{s:z[0],t:z.slice(1).join('|'),attempt,correct,rate,bad:Math.max(bad,saved)}}).filter(x=>x.bad>0).sort((a,b)=>a.rate-b.rate||b.bad-a.bad||b.attempt-a.attempt).slice(0,6);
 if(!rows.length)return `<div class="card"><b>🧠 Ağıllı zəif mövzular</b><p class="m">Mövzular üzrə dəqiq təhlil üçün bir neçə məşq və ya sınaq tamamla. Sistem səhv və düzgün cavabları bu cihazda saxlayacaq.</p><button onclick="tab('prac')">Məşqə başla</button></div>`;
 let total=rows.reduce((n,x)=>n+x.bad,0);
 return `<div class="card"><b>🧠 Ağıllı zəif mövzular</b><p class="m">${total} səhv cavaba əsasən təkrar üçün ən vacib mövzular. Faiz yalnız qeydə alınmış suallara aiddir.</p>${rows.map((x,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--b)"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><b>${esc(x.t||'Ümumi mövzu')}</b><div class="m">${esc(x.s)} · ${x.bad} səhv / ${x.attempt} sual</div></div><b class="${x.rate<50?'no':x.rate<75?'':'ok'}">${x.rate}%</b></div><div class="meter"><i style="width:${x.rate}%;background:${x.rate<50?'#ef6262':'var(--p)'}"></i></div><p class="m" style="margin:7px 0">${x.rate<50?'Tövsiyə: mövzunu yenidən öyrən, sonra qısa test et.':x.rate<75?'Tövsiyə: bu mövzudan əlavə məşq et.':'Tövsiyə: yadda saxlamaq üçün bir neçə təkrar sual həll et.'}</p><button onclick="repeatWeakTopic('${String(x.s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}','${String(x.t).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">Bu mövzunu təkrar et</button></div>`).join('')}<button class="p" onclick="weak()">Bütün zəif mövzulardan qarışıq test</button></div>`;

["Xarici dil", "Conditionals", "Şərt cümlələri (Conditionals)", "Zero: If + Present, Present (həmişə doğru fakt). 1-ci tip: If + Present Simple, will + V (real gələcək). 2-ci tip: If + Past Simple, would + V (indi üçün qeyri-real; be üçün were). 3-cü tip: If + Past Perfect, would have + V3 (keçmişdə baş verməmiş). Unless = if … not. if/when/unless-dən sonra will işlənmir", "If it rains, we will stay home. / If I had known, I would have helped.", "If I will see him … yazmaq (If I see him …)"],
["Xarici dil", "Reported speech", "Dolayı nitq (Reported speech)", "Zaman bir pillə geriyə gedir: am/is → was; do/does → did; Present Perfect, Past Simple → Past Perfect; will → would; can → could; must → had to. Zərflər: today → that day, tomorrow → the next day, yesterday → the day before, now → then, here → there. Dolayı sual: if/whether və ya wh-söz + düz söz sırası (do/did yoxdur). Əmr: told/asked + obyekt + (not) to + V", "\"I am tired.\" → She said that she was tired. / He asked where I lived.", "He asked where did I live (düz sıra: where I lived)"],
["Xarici dil", "Infinitive & -ing", "Infinitive və -ing forması", "to + V: decide, want, hope, plan, learn, agree, refuse, promise, manage. V-ing: enjoy, finish, mind, avoid, suggest, keep, give up. To-suz infinitiv: modal feillərdən, make/let + obyekt, see/hear/watch + obyektdən sonra. Önlükdən sonra yalnız V-ing (good at swimming, way of learning)", "She enjoys swimming. / He decided to go. / Mom made me clean my room.", "enjoy to swim; decide going; made me to clean"],
["Xarici dil", "Prepositions", "Önlüklər", "Vaxt: at + saat/gecə (at 5, at night); on + gün/tarix (on Monday, on May 5); in + ay/il/fəsil/günün hissəsi (in July, in 2020, in the morning). since + başlanğıc nöqtə, for + müddət. Yer: at + nöqtə (at school), in + daxildə (in a room), on + səthdə (on the table). Feil/sifət + önlük: afraid of, good at, interested in, depend on, listen to, wait for, belong to, look for", "I have lived here since 2018 / for five years.", "in Monday; since five years; afraid from"],
["Xarici dil", "Pronouns", "Əvəzliklər və nisbi əvəzliklər", "who – şəxs; which – əşya; that – şəxs/əşya; whose – kimin (mənsubiyyət); whom – obyekt şəxs. Qayıdış əvəzlikləri (myself, himself, themselves …) hərəkət öz üzərinə qayıdanda işlənir. mine, hers, theirs-dən sonra isim gəlmir. its (onun) ≠ it’s (it is). either – ikisindən biri; neither – heç biri; each – hər biri", "The girl whose father is a pilot … / He cut himself.", "its ilə it’s qarışdırmaq; whose əvəzinə who yazmaq"],
["Xarici dil", "Questions", "Sual cümlələri", "Düz söz sırası: Wh- + köməkçi + mübtəda + əsas feil (Where do you live?). Mübtəda soruşulanda köməkçi işlənmir (Who broke the window?). Present/Past Simple üçün do/does/did, onda əsas feil 1-ci formada olur. Dolayı sual düz sıra ilə: Do you know where he lives?", "What did she buy? / Who painted this picture?", "Where he lives? / Who did paint …? / did + V2"],
["Xarici dil", "Short answers & tags", "Tag suallar və qısa razılıq", "Müsbət cümlə → mənfi tag, mənfi cümlə → müsbət tag, eyni köməkçi ilə: She can swim, can’t she? / He doesn’t drink tea, does he? Köməkçi yoxdursa do/does/did. Let’s … → shall we? Əmr → will you? Razılıq: So + köməkçi + mübtəda (müsbət); Neither/Nor + köməkçi + mübtəda (mənfi)", "You like pizza, don’t you? / So do I. / Neither do I.", "So I do; Neither don’t I (Neither özü mənfidir)"],
["Xarici dil", "Conjunctions", "Bağlayıcılar", "and – əlavə; but – ziddiyyət; or – seçim; so – nəticə; because – səbəb; although/though – ziddiyyət (Although … , … ; but ilə birlikdə işlənmir); unless = if … not; while/when/before/after/until – vaxt; both … and; either … or; neither … nor", "Although it was cold, we went out. / It was late, so we left.", "Although … but … birlikdə işlətmək; because əvəzinə so yazmaq"],
["Xarici dil", "Nouns", "İsimlər: cəm, sayılma, mənsubiyyət", "Müntəzəm cəm: -s/-es (box – boxes), samit + y → -ies (city – cities). Qeyri-müntəzəm: man – men, woman – women, child – children, foot – feet, tooth – teeth, mouse – mice, person – people; sheep, fish dəyişmir. Sayılmayan (cəmi olmur): water, milk, money, advice, information, news, furniture, bread. Mənsubiyyət: Tom’s book, the boys’ room, children’s toys", "She gave me some useful advice. / The news is good.", "advices, informations, furnitures; the news are"],
["Xarici dil", "Phrasal verbs", "Phrasal verbs", "Feil + ədat mənanı dəyişir: look for – axtarmaq; look after – qayğı göstərmək; give up – əl çəkmək; take off – çıxarmaq/(təyyarə) havaya qalxmaq; put on – geyinmək; turn on/off – yandırmaq/söndürmək; find out – öyrənmək; call off – ləğv etmək; carry on – davam etmək; get up – durmaq; run out of – qurtarmaq. Ayrılan feildə əvəzlik arada durur: take it off", "He gave up smoking. / Take them off.", "take off it (düz: take it off); look at əvəzinə look for"],
["Xarici dil", "Word formation", "Söz yaradıcılığı", "Prefikslər: un-, in-/im-/il-/ir-, dis-, mis- (əks və ya səhv məna: unhappy, impossible, dislike, misunderstand). Suffikslər: -er/-or (şəxs: teacher, actor); -tion/-ment/-ness (isim: decision, movement, happiness); -ful/-less (sifət: careful/careless); -ly (zərf: carefully). -ed hiss edəni, -ing təsir edəni bildirir: bored / boring", "I was bored because the film was boring.", "I am boring (mən darıxdırıcıyam) əvəzinə I am bored"],
["Xarici dil", "Adjectives & adverbs", "Sifət və zərf", "Sifət isimi təyin edir (a careful driver), zərf feili, sifəti və başqa zərfi təyin edir (drives carefully). Zərf adətən sifət + -ly. İstisnalar: good → well; fast, hard, late formasını dəyişmir (hardly = çətin ki). look, feel, sound, seem, taste feillərindən sonra sifət gəlir", "She looks happy. / He runs fast.", "He runs quickly əvəzinə quick; She feels badly"],
["Xarici dil", "Negation", "Mənfi cümlələr", "Mənfi cümlədə some → any (I haven’t any money), something → anything. no/nobody/nothing/never özü mənfidir – yanında ikinci inkar işlənmir. both … and → neither … nor; mənfi cümlədə too/also əvəzinə either işlənir", "I don’t like such films either. / Nobody knows the answer.", "He doesn’t know nothing; Nobody doesn’t know; I also don’t like"],
["Xarici dil", "Exclamations", "Nida cümlələri", "What + (a/an) + sifət + isim: What a beautiful day! / What awful weather! (sayılmayan və cəm isimdə a/an yoxdur: What pretty girls!). How + sifət/zərf + mübtəda + feil: How beautiful this city is! Nidada söz sırası düzdür (inversiya olmur)", "What an amazing game we had! / How fast he runs!", "What a beautiful days; How beautiful is this city; What a awful weather"],
["Xarici dil", "Verbs", "Müntəzəm və qeyri-müntəzəm feillər", "Müntəzəm feillər V2 və V3 formasında -ed qəbul edir (wash–washed–washed); samit + y → -ied (study–studied). Qeyri-müntəzəm feillər yadda saxlanılır: go–went–gone, write–wrote–written, buy–bought–bought, teach–taught–taught, catch–caught–caught, break–broke–broken, speak–spoke–spoken", "She studied hard. / He has written a letter.", "buyed, teached, catched, writed, studyed"],
["Xarici dil", "Vocabulary", "Söz ehtiyatı: sinonim, antonim, kollokasiya", "Sinonim – yaxın mənalı (big = large, begin = start, enormous = huge); antonim – əks mənalı (ancient ↔ modern, expensive ↔ cheap). Kollokasiya: make a mistake / make a decision, do homework / do the shopping. -ed hiss edən (interested, bored), -ing təsir edən (interesting, boring)", "She made a mistake. / I am interested in history.", "do a mistake; I am interesting in history"],
["Xarici dil", "Reading", "Oxu mətni ilə iş", "Əvvəl suala bax, sonra mətndə açar sözü tap. Ana fikir (main idea) – mətnin bütövlükdə nədən bəhs etdiyidir, ilk və son cümlələrə diqqət et. Detal sualında cavab mətndə sözbəsöz və ya sinonimlə verilir. Mənanı bilmədiyin söz üçün ətrafdakı sözlərə bax. Cavabı mətndən yoxla, öz biliyinə əsaslanma", "Sual: Why …? → mətndə because / so that / to axtar.", "Mətndə olmayan, amma doğru görünən məlumatı seçmək; ana fikir əvəzinə detalı seçmək"],

ılıb. ACDB simvollar ardıcıllığını formalaşdırdıqdan sonra alınan ifadədəki 1-ləri 0-larla, 0-ları 1-lərlə əvəz edib, səkkizlik say sistemində göstərin.", ["345", "325", "65", "55", "505"], 3, null], ["ÜSİ-1 (B variantı)", "Qrafik təsvir 256x1024 nöqtədən ibarət olub CMYK rənglər palitrasında kodlaşdırılarsa, 48 belə qrafik təsvirin ölçüsü neçə Mbayt olar?", ["48", "40", "24", "36", "72"], 0, null], ["ÜSİ-1 (B variantı)", "Verilmiş Python kodunun icrasından sonra ekranda hansı nəticə görünəcək?<br>s=[3,8,9,2,-4,15]<br>x=0<br>for i in s:<br>&nbsp;&nbsp;&nbsp;&nbsp;x=x+i<br>y=2<br>if x%y&gt;=0:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"A\",end=\"\")<br>elif x&gt;y:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"B\",end=\"\")<br>if y+x%5==0:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"C\",end=\"\")<br>else:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"D\")", ["A", "BD", "BC", "AD", "CD"], 3, null], ["ÜSİ-1 (B variantı)", "Kompüter sistemində qeydiyyatdan keçmək üçün hər bir istifadəçiyə 10 simvollu şəxsi şifrə və müəyyən əlavə məlumat verilir. Şifrədə yalnız A, B, C, D, E, F, G, H və onluq rəqəmlərdən simvollarından istifadə olunub. Hər bir belə şifrə kompüter proqramında minimal və eyni tam bayt uzunluğunda yazılır, bununla yanaşı hər bir simvol da ayrı-ayrılıqda və minimal mümkün bit sayı ilə kodlaşdırılır. Bir istifadəçinin qeydiyyatı üçün 12 bayt tələb olunursa, əlavə məlumat neçə baytdır?", ["2", "5", "7", "10", "12"], 1, null], ["ÜSİ-1 (B variantı)", "Python dilində yazılmış proqramın nəticəsini müəyyən edin.<br>x=0<br>y=1<br>for i in range(1,11):<br>&nbsp;&nbsp;&nbsp;&nbsp;if i%3==i%5:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x=x+1<br>&nbsp;&nbsp;&nbsp;&nbsp;elif i%2==i%4:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;y=y+x<br>&nbsp;&nbsp;&nbsp;&nbsp;else:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x=x+i<br>print(y)", ["29", "36", "47", "28", "52"], 2, null], ["ÜSİ-1 (B variantı)", "Python kodunun nəticəsi necə olacaq?<br>s=0<br>for i in range(1,7):<br>&nbsp;&nbsp;&nbsp;&nbsp;if i%2==0:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;s=s+1<br>&nbsp;&nbsp;&nbsp;&nbsp;if i%3==0:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;s=s+2<br>&nbsp;&nbsp;&nbsp;&nbsp;else:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;s=s+3<br>&nbsp;&nbsp;&nbsp;&nbsp;s=s+i<br>print(s)", ["34", "40", "37", "43", "46"], 1, null], ["ÜSİ-1 (B variantı)", "Python kodunun nəticəsi necə olacaq?<br>x=[12,23,17,44,38]<br>y=x[0]<br>for i in range(0,len(x)):<br>&nbsp;&nbsp;&nbsp;&nbsp;if y&lt;x[i]:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;y=x[i]<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;z=x.index(y)<br>print(z)", ["1", "3", "4", "2", "44"], 1, null], ["ÜSİ-1 (B variantı)", "Uyğunluğu müəyyən edin:<br>1. Axtarış sistemləri<br>2. İnternet xidməti<br>3. Sosial şəbəkə<br>a) LinkedIn&nbsp;&nbsp; b) Excite&nbsp;&nbsp; c) FTP&nbsp;&nbsp; d) IRC (GAP)&nbsp;&nbsp; e) Tumblr&nbsp;&nbsp; f) Lycos", ["1-c,d; 2-b,f; 3-a,e", "1-b,f; 2-a,e; 3-c,d", "1-b,f; 2-c,d; 3-a,e", "1-a,e; 2-c,d; 3-b,f", "1-d,f; 2-b,c; 3-a,e"], 2, null]]);
if(window.__SOLS)window.__SOLS.unshift(...[[/b\.index\(2\)/,()=>["b.index(2) = 0 (2 ədədi b-də ilk dəfə 0-cı mövqedədir) ⇒ s = 0", "a-nın elementlərindən b-də olanlar: 3, 4, 8, 8 (5, 0 və 6 b-də yoxdur)", "Belə hər element üçün s 1 artır: s = 0 + 4 = 4"]],[/514\*514/,()=>["514·514 = 264196", "264196 : 16 = 16512 (qalıq 4); 16512 : 16 = 1032 (qalıq 0); 1032 : 16 = 64 (qalıq 8); 64 : 16 = 4 (qalıq 0); 4 : 16 = 0 (qalıq 4)", "Qalıqları sondan əvvələ yazırıq: 40804"]],[/Ümumi Sınaq İmtahanı/,()=>["2-ci sətir: test.html, izahlar.html, ballar.html", "Bu sətirin 3-cü sütunu: ballar.html"]],[/a,b,c=7,12,23/,()=>["Bərabərliyin sağ tərəfi əvvəlcə köhnə qiymətlərlə hesablanır: 16//3 = 5, 23%5 = 3, c//b = 23//12 = 1", "Sonra mənimsədilir: b = 5, c = 3, a = 1", "print(a, b, c) ⇒ 1 5 3"]],[/kompüter qurğuları\)/,()=>["Lazerli printerin sürəti dəqiqədə çap etdiyi səhifələrin sayı (ppm) ilə ölçülür", "Yanlış variantlar: ilk monitorlar CRT (elektron-şüa borulu) idi; monitor rəngləri əsas RGB rəngləri ilə alınır; CD-lərdə əsasən audio, video isə DVD-lərdə saxlanılır"]],[/Hilalə, İbrahim, İsmayıl/,()=>["Xədicə İbrahimdən 2 saat sonra çıxır: (İbrahim; Xədicə) cütü (1;3), (3;5) və ya (5;7) ola bilər", "İsmayıl, Səmra, İbrahim ardıcıllığı lazımdır: İbrahimdən əvvəl ən azı 2 nəfər çıxmalıdır, ona görə yalnız (5;7) uyğundur", "Sıra: İsmayıl 1, Səmra 3, İbrahim 5, Xədicə 7, Hilalə 8 saat"]],[/A=\[5,4,3,1,2\]/,()=>["Dövr siyahının hər elementini 1 artırır", "[5, 4, 3, 1, 2] ⇒ [6, 5, 4, 2, 3]"]],[/Xidməti proqramları müəyyən edin/,()=>["Xidməti (utilit) proqramlar kompüterin işini yoxlayır, qoruyur və xidmət göstərir", "McAfee və Avast — antivirus, ScanDisk — diskin yoxlanması proqramıdır ⇒ 2, 4, 5", "Open Office Writer — tətbiqi proqram, Pascal — proqramlaşdırma dili, MS DOS — əməliyyat sistemidir"]],[/a=\[8,-5,0,-8\]/,()=>["Diqqət: şərt i-ni yox, b-ni yoxlayır (b%2==0)", "b = 11 təkdir ⇒ b = 10; sonra b cütdür: 12, 14, 16", "Dövr 4 dəfə işləyir: 11 → 10 → 12 → 14 → 16. Nəticə: 16"]],[/m=x\/\/10/,()=>["m = x//10 onluq, t = x%10 təklik rəqəmidir", "t, m = m, t ⇒ t onluq, m təklik rəqəmi olur", "str(m)+str(t) əvvəlcə təklik, sonra onluq rəqəmini yazır. Məsələn, 47 ⇒ 74"]],[/i==1 or i==n/,()=>["i = 1 və i = 5 olduqda n*\"*\" ⇒ 5 ulduz çap olunur", "i = 2, 3, 4 üçün bir ulduz çap olunur", "print hər dəfə yeni sətirdə, soldan başlayaraq çap edir: ***** / * / * / * / *****"]],[/\$A1\+B\$2-\$C\$2/,()=>["D1 = $A1+B$2−$C$2 = 5 + 3 − 2 = 6", "Aşağı sürüşdürdükdə yalnız nisbi sətir dəyişir: D2 = $A2+B$2−$C$2 = 9 + 3 − 2 = 10; D3 = $A3+B$2−$C$2 = 3 + 3 − 2 = 4", "SUM(D1:D3) = 6 + 10 + 4 = 20; SUM(B1:C2) = 6 + 7 + 3 + 2 = 18", "D4 = 20 − 18 = 2"]],[/Qrafik təsvirlərə link vermək/,()=>["Şəkil <img> teqi ilə əlavə olunur, link isə <a> teqinin href atributu ilə verilir", "Şəkli linkə çevirmək üçün &lt;img&gt; teqi &lt;a href=\"\"&gt; ... &lt;/a&gt; daxilində yazılır"]],[/şərt bloku ən azı neçə dəfə/,()=>["x tam ədəddir, ona görə dörd hal var: x > 6, x = 6, x = 5 və x < 5 (qalan bütün hallar)", "Dörd halı ayırmaq üçün 3 şərt kifayətdir: x > 6? x = 6? x = 5? — üçü də \"xeyr\" olduqda x < 5", "Cavab: 3"]],[/s dəyişəninin 64/,()=>["s = 1 · 4 · 4 · 4 = 64 ⇒ dövr düz 3 dəfə icra olunmalıdır", "n, n+9, n+18 üçün n < 100 doğru, n+27 üçün yalan olmalıdır", "n + 18 < 100 ⇒ n < 82; n + 27 ≥ 100 ⇒ n ≥ 73", "Ən kiçik natural qiymət: n = 73"]],[/açar sözünə əsasən sorğunun nəticəsini/,()=>["Daxilolma-xaric etmə: |X∪Y∪Z| = X + Y + Z − (X∩Y) − (Y∩Z) − (X∩Z) + (X∩Y∩Z)", "760 = 300 + 400 + 320 − 100 − 120 − 110 + t", "760 = 690 + t ⇒ t = 70"]],[/7 kb-lıq səs faylı/,()=>["Fayl klasterləri tam tutur: 7 kb ⇒ ⌈7/3⌉ = 3 klaster", "5 kb ⇒ ⌈5/3⌉ = 2 klaster", "Cəmi: 3 + 2 = 5 klaster"]],[/Kriptoqrafiya/,()=>["1 — doğrudur (kryptos — gizli, grafo — yazı)", "2 — yalnışdır: elektron imza asimmetrik şifrələmə ilə qurulur", "3 — doğrudur; 4 — doğrudur (eyni açar); 5 — doğrudur (açıq açar şifrələyir, gizli açar deşifrələyir)", "Düzgün fikirlər: 1, 3, 4, 5"]],[/3 və n simvollarının/,()=>["Rəqəmlərin kodları ardıcıl artır: 1 → 49, 9 → 57 ⇒ '3' → 51", "Kiçik hərflər də ardıcıldır: a → 97 ⇒ 'n' (a-dan 13 sonra) → 110", "51 = 33₁₆, 110 = 6E₁₆", "33₁₆ + 6E₁₆ = A1₁₆"]],[/ACDB simvollar/,()=>["ACDB ⇒ 11 01 00 10 = 11010010", "1-ləri 0-la, 0-ları 1-lə əvəz edək: 00101101", "Səkkizlik üçün sağdan üçlü qruplar: 00 | 101 | 101 ⇒ 0 5 5", "Cavab: 55₈"]],[/256x1024/,()=>["CMYK — 4 kanal, hər piksel 32 bit = 4 bayt", "256 · 1024 · 4 = 1 048 576 bayt = 1 Mbayt (bir təsvir)", "48 təsvir ⇒ 48 Mbayt"]],[/s=\[3,8,9,2,-4,15\]/,()=>["x = 3 + 8 + 9 + 2 − 4 + 15 = 33, y = 2", "x % y = 33 % 2 = 1 ≥ 0 ⇒ \"A\" çap olunur (elif yoxlanılmır)", "y + x % 5 = 2 + 3 = 5 ≠ 0 ⇒ else: \"D\"", "Ekranda: AD"]],[/10 simvollu şəxsi şifrə/,()=>["Simvollar: 8 hərf (A–H) + 10 rəqəm = 18 simvol", "2⁴ = 16 < 18 ≤ 32 = 2⁵ ⇒ hər simvol 5 bit", "10 simvol = 50 bit ⇒ tam bayt: ⌈50/8⌉ = 7 bayt (şifrə)", "Əlavə məlumat: 12 − 7 = 5 bayt"]],[/i%3==i%5/,()=>["i = 1, 2: i%3 = i%5 ⇒ x = 2", "i = 3: else ⇒ x = 5; i = 4: i%2 = i%4 ⇒ y = 1 + 5 = 6", "i = 5: i%2 = i%4 = 1 ⇒ y = 6 + 5 = 11; i = 6, 7: else ⇒ x = 11, sonra x = 18", "i = 8: y = 11 + 18 = 29; i = 9: y = 29 + 18 = 47", "i = 10: else ⇒ x = 28 (y dəyişmir). Nəticə: 47"]],[/range\(1,7\).*i%2==0/,()=>["i = 1: +3, +1 ⇒ s = 4", "i = 2: +1 (cüt), +3, +2 ⇒ s = 10", "i = 3: +2 (3-ə bölünür), +3 ⇒ s = 15", "i = 4: +1, +3, +4 ⇒ s = 23", "i = 5: +3, +5 ⇒ s = 31", "i = 6: +1, +2, +6 ⇒ s = 40"]],[/z=x\.index\(y\)/,()=>["y = 12; dövr y-dən böyük element tapdıqda y-i yeniləyir", "i = 1: 12 < 23 ⇒ y = 23, z = 1", "i = 3: 23 < 44 ⇒ y = 44, z = 3", "Başqa yenilənmə yoxdur ⇒ z = 3"]],[/Axtarış sistemləri/,()=>["Axtarış sistemləri: Excite, Lycos (b, f)", "İnternet xidməti: FTP, IRC (c, d)", "Sosial şəbəkə: LinkedIn, Tumblr (a, e)"]]]);

try{
const EXPL={"She ___ to school every day.": "Present Simple: 3-cü şəxs təkdə (she) feilə -s artırılır: goes. every day vərdiş bildirir.", "I ___ already finished my homework.": "I ilə have işlənir; already → Present Perfect (have + V3).", "Choose the synonym of big.": "big (böyük) ilə eyni mənalı sözdür: large. small, tiny, thin, short – başqa mənalıdır.", "Choose the correct words for each sentence. 1. I can buy this watch because I have ... money. 2. There were so ... people that I couldn't find him. 3. I went there, but very ... men met me. a. many b. a little c. few": "money sayılmayandır → a little (1-b). people sayılandır, so many people (2-a). men sayılandır, very few men – few (3-c).", "Choose the correct tense forms. Tom ... a reporter before he ... a businessman.": "Əvvəl reporter olub (Past Perfect: had been), sonra businessman olub (Past Simple: became). before ilə əvvəlki hərəkət Past Perfect olur.", "Choose the correct sentence with the Complex Object.": "Complex Object: see/notice/hear + obyekt + to-suz infinitiv (I noticed them paint). Digərləri: want me TO become, made us TAKE, seen Jessica CROSS olmalıdır.", "Choose the line of compound nouns.": "Mürəkkəb isim iki müstəqil sözdən (defislə) yaranır: mother-in-law, apple-tree. Digər sətirlərdə törəmə sözlər var (-ment, -hood, -dom, ex-).", "How many variants are correct? ... to somebody 1) to listen 2) to belong 3) to believe 4) to be married 5) to talk": "listen TO, belong TO, be married TO, talk TO düzgündür (4). believe to ✗ – believe somebody / believe in.", "Choose the correct sentences. 1. Two bottles of milk was in the fridge. 2. Most people living in Azerbaijan are very kind to others. 3. These sacks full of rice isn't heavy for my elder brother. 4. The citizens of our country have to defend our territories.": "2 və 4 düzgündür (are kind; have to defend). 1-də bottles ... were olmalıdır, 3-də sacks ... aren't olmalıdır.", "Choose the correct variant. They produce ... or do necessary things for ... people.": "Müsbət cümlədə something işlənir; other + cəm isim (other people). others təkbaşına işlənir, ismin qabağında yox.", "Choose the correct modal verb. People ... smoke when there are children around.": "Uşaqlar ətrafında siqaret çəkmək olmaz – məsləhət/qadağa mənasında shouldn't.", "Choose the correct variant. There are ... a lot of boys and ... many girls in the hall, but it is ... silent.": "such a lot of boys (such + a lot of); so many girls; very silent (very + sifət).", "Choose the correct tense forms. They ... all the food by the time they ... the way out of the forest.": "by the time-dan sonra Past Simple (found), ondan əvvəl bitən hərəkət Past Perfect (had eaten).", "Choose the correct prepositions. Pick ... these toys and put them ... the bag.": "pick up – götürmək; put them INTO the bag – çantanın içinə qoymaq.", "Choose the correct sentences. 1. Jane has a long hair. 2. There is a hair on your shirt. 3. An iron is a piece of metal. 4. We bought a steam iron.": "2 və 4 düzgündür: a hair on your shirt (bir tük), a steam iron (ütü). 1-də long hair sayılmayan, 3-də iron (metal) sayılmayan, a/an olmur.", "Choose the correct variant. – Have you ever heard of West Side Story? – Yes, ... a musical. ... has some wonderful songs.": "Yes, it's (it is) a musical. It has some songs – it is mübtəda, its (onun) lazım deyil.", "Choose the sentences in the Passive Voice. 1. Are the oranges grown in Lankaran tasty? 2. Where are these lemons grown? 3. A pomegranate is a fruit grown in Geokchai. 4. A cigarette is a thing that is smoked. 5. Are the poems written by you interesting?": "2 və 4 Passive-dir: are grown, is smoked (be + V3). 1, 3, 5-də V3 yalnız təyindir (oranges grown in ..., fruit grown in ...).", "Choose the correct variant. The chief made the workers ... the things.": "make + obyekt + to-suz infinitiv: made the workers raise.", "Choose the correct tense forms. He ... us last in February, but he ... ever since.": "last in February – keçmiş (Past Simple: phoned); ever since – indiyədək (Present Perfect: hasn't phoned).", "How many variants are correct? He wants ... of us to be there at ten o'clock. 1. every 2. each 3. both 4. no 5. all": "each of us, both of us, all of us düzgündür (3). every of us ✗ (every one of us), no of us ✗ (none of us).", "Choose the correct modal verb. The doctor says that your mother ... to leave hospital next week.": "Gələn həftə üçün bacarıq: will be able to. will able və shall be able yanlışdır.", "Choose the line of regular verbs.": "Müntəzəm feillər -ed qəbul edir: study–studied, water–watered, close–closed. Digər sətirlərdə qeyri-müntəzəm feillər var (wake, get, find, keep, lie, leave).", "Choose the correct variant. Jane did ... tests that yesterday she got tired. 1. so many 2. such difficult 3. so difficult 4. so much": "so many tests (1) və such difficult tests (2). so difficult tests ✗, so much tests ✗ (tests sayılandır).", "Choose the correct tense forms. The child ... better after he ... a medicine.": "Əvvəl dərmanı içib (Past Perfect: had taken), sonra özünü yaxşı hiss edib (Past Simple: felt).", "Choose the correct variant. She didn't tell anybody ... she had meant by her action.": "tell anybody WHAT she had meant – obyekt sual əvəzliyi what.", "Choose the correct answer with the verb in the Passive Voice. – Did they steal your money?": "Passive Past Simple: was + V3 (was stolen). Did they steal...? → Yes, my money was stolen.", "Choose the sentence with the Possessive Case.": "at her grandfather's – mənsubiyyət (kimin evində). Digərlərində 's = is/has.", "Choose the correct variant. My trousers ...": "trousers həmişə cəmdir → are very cheap.", "Choose the correct tense forms. If you ... careful, you ... the vase.": "Şərt 1-ci tip: If + Present Simple, will + V → If you are not careful, you will break the vase.", "Choose the correct variant. 1. to be afraid of a snake 2. to turn of the television 3. to switch of the light 4. to be ashamed of bad behaviour": "afraid OF və ashamed OF düzgündür (1, 4). turn OFF, switch OFF olmalıdır (of ✗).", "Choose the correct exclamatory sentences. 1. How beautiful this city is! 2. What a beautiful day! 3. What a beautiful days! 4. How beautiful this is city!": "How + sifət + mübtəda + feil (How beautiful this city is!); What a + sifət + tək isim (What a beautiful day!). 3 və 4 səhvdir.", "Choose the correct pronoun. ... chapter did you like best?": "Məhdud sayda fəsil arasından seçim → which chapter.", "Choose the correct variant. 1. We spent an holiday at the Browns. 2. The fishermens' fish were stolen. 3. Ben's going to school. 4. I had a few weeks' rest.": "3 və 4 düzgündür: Ben's = Ben is; a few weeks' rest (mənsubiyyət). 1: a holiday (an ✗), 2: fishermen's olmalıdır.", "Choose the correct article. Italy is in ... South of ... Europe, isn't it?": "Italy is in THE South of Europe – the south (coğrafi istiqamət) və Europe-dan əvvəl artikl yoxdur.", "Choose the correct variant. – Did you buy ... milk? – No, only ... .": "milk sayılmayandır: Did you buy much milk? (sual) – No, only a little.", "Choose the correct modal verb. Patient: Must I go to the hospital? Doctor: No, you ... . You ... stay at home.": "Must I...? sualına mənfi cavab: needn't (vacib deyil). Evdə qalmağa icazə: may.", "Choose the correct negative sentence. That was either a book or a pen.": "either ... or → neither ... nor: That was neither a book nor a pen.", "Choose the correct tense forms. When Christopher Columbus ... 14 he ... a sailor.": "Keçmiş zaman: was ... became (Past Simple).", "Choose the correct sentence in the Passive Voice. They haven't visited us yet.": "Present Perfect Passive: have/has been + V3. Fail dəyişir: They haven't visited us → We haven't been visited.", "Choose the correct preposition. My job interview is ... Friday.": "Həftənin günü ilə on: on Friday.", "Choose the correct conjunction. ... I like music, I can't play any instrument.": "Though – ziddiyyət: Mən musiqini sevirəm, amma heç bir alətdə çalmıram.", "Complete the sentence. Father warned me ... .": "warn + obyekt + (not) to + V: warned me not to paint his car.", "Choose the correct variant. My friend doesn't like detective stories.": "Mənfi cümləyə razılıq: Neither + köməkçi + mübtəda → Neither do I.", "Choose the correct variant. Vatican is ... country in Europe.": "Ən üstünlük dərəcəsi: the smallest country.", "Choose the correct article. ... Moon has no ... light. It is bright because ... Sun shines on it.": "the Moon, no light (artikl yoxdur), the Sun – unikal obyektlər.", "Choose the correct prepositions. We shall be waiting ... a bus ... 2 till 5.": "wait FOR a bus; from 2 till 5.", "Choose the correct modal verb. Teacher: \"You ... ring me up when you ... my advice.\"": "icazə/imkan: may; when you need (zaman budaq cümləsində Present Simple).", "Choose the correct interrogative sentence. ... book is this? 1. How 2. Whom 3. Who 4. What kind 5. Whose": "What kind of book is this? / Whose book is this? Who və How bu sual üçün uyğun deyil.", "Choose the correct variant. It was hot ... I didn't need my coat.": "Nəticə: It was hot, so I didn't need my coat.", "Choose the uncountable nouns.": "Sayılmayan isimlər: soap, rice, butter. Digərlərində sayıla bilən isimlər var (toy, book, bottle, hand, tooth).", "Complete the sentence. She advised me ... .": "advise + obyekt + to + V: advised me to take my hat off.", "Choose the correct form of the verb. I have never heard him ... Russian.": "hear + obyekt + V-ing: I have never heard him speaking Russian.", "Choose the correct pronouns. I have ... book at school. Give me ..., please.": "I have NO book (no + isim); Give me SOME (isimsiz, müsbət).", "Choose the correct conjunction. Stop at a petrol station ... we run out of petrol.": "Stop at a petrol station BEFORE we run out of petrol – benzin qurtarmamışdan əvvəl.", "Choose the correct variant. Mary picked ... flowers in the garden. 1. much 2. many 3. a lot of 4. so many 5. a lot": "many flowers, a lot of flowers, so many flowers düzgündür (2, 3, 4). much sayılmayan, a lot (of olmadan) isimdən əvvəl işlənmir.", "Choose the correct preposition. He has a pain ... his leg.": "a pain IN my leg – bədən üzvündə ağrı: in.", "Choose the correct variant. I had to help my mother about the house.": "had to ... Past Simple kimi davranır: So did I.", "Choose the correct exclamatory sentences. 1. What a beautiful girl is she! 2. What awful weather! 3. What a beautiful girl she is! 4. What an awful weather!": "2 və 3: What awful weather! (weather sayılmayan, a yoxdur); What a beautiful girl she is! (düz söz sırası).", "Choose the correct interrogative sentence. ... is heavier, a kilo of gold or a kilo of wheat?": "İki şeyin arasından seçim: Which is heavier...?", "Choose the correct tense forms. I ... never ... to London, but I once ... Oxford.": "never ... been to London (Present Perfect: have never been); once visited Oxford (Past Simple).", "Choose the correct conjunction. It was very hot, ... I opened the window. 1. and 2. but 3. so 4. though": "1 və 3: and, so (sıra və nəticə). but/though bu mənaya uyğun deyil.", "Choose the correct variant. – I had to wait half an hour for a bus. – ... You waited so long.": "had to (keçmiş) → Did you?", "Choose the correct interrogative sentence. (past event)": "Mübtəda soruşulanda did işlənmir: What happened ...?", "Choose the correct variant. My little finger is ... my middle finger.": "İki şeyin müqayisəsi: shorter than.", "Complete the sentence. She wanted to know ... .": "Dolayı sual: if + düz söz sırası: if her father would let her go.", "Choose the correct interrogative sentence. (quantity)": "sacks sayılandır → How many; sual sırası: are there.", "Complete the sentence. I really want to know when ... .": "Dolayı sual düz sıra ilə: when the telephone was invented (Passive Past Simple).", "Choose the correct variant. – Tom always needs his parents' advice. – ... .": "always needs (Present Simple) → maraq bildirən sual: Does he?", "Choose the correct sentence in the Passive Voice. They advised us to go to Gabala.": "Passive: They advised us → We were advised to go to Gabala.", "Choose the correct variant. He talked ... about his new job.": "Zərf feili təyin edir: talked interestingly.", "Choose the correct variant. She is interested in gymnastics.": "is interested → So is her sister (müsbət razılıq).", "Choose the correct variant. It was late ... I was tired, ... I went to bed.": "It was late and I was tired, so I went to bed.", "Choose the correct sentence in the Passive Voice. They have written the letter quite quickly.": "Present Perfect Passive: has been written.", "How many variants are correct? My mother cooked ... 1. a bread 2. some bread 3. loaf of bread 4. a loaf of bread 5. many bread": "bread sayılmayan isimdir: some bread (2) və a loaf of bread (4) düzgündür. a bread, loaf of bread (artiklsız), many bread ✗.", "Choose the correct variant. This exercise is ... than the last one. The last exercise was ... than this one.": "easy → easier; difficult → more difficult.", "Complete the sentence. They were interested in ... .": "Dolayı sual düz söz sırası ilə: who their son had found the money from.", "Choose the correct sentence in the Passive Voice. They buy all kinds of fruit at the market.": "Present Simple Passive, cəm: fruit are bought → are + V3.", "Choose the correct interrogative sentence. (past, with a person)": "Mübtəda soruşulanda did işlənmir: Who translated ...?", "Complete the sentence. – My neighbour has made many mistakes in the exam. – ... .": "has made → So has mine.", "Choose the correct variant. There is a little village ... was founded by some Dutch colonists. 1. which 2. where 3. what 4. that": "Şey üçün nisbi əvəzlik which və ya that. where və what burada işlənmir.", "Choose the correct negative sentence.": "Mənfi cümlədə sonda either işlənir: I don't like such films either.", "Choose the correct modal verbs. If you ... fix a radio, you ... repair a TV too.": "If you can fix a radio, you will be able to repair a TV too.", "Choose the correct exclamatory sentences. 1. What a big eyes you had! 2. What an amazing game we had! 3. What a amazing game we had! 4. What big eyes you have!": "2 və 4: What an amazing game ... ; What big eyes you have! 1: a big eyes ✗, 3: a amazing ✗.", "Choose the correct variant. My father never drinks coffee, ... ?": "never mənfi mənalıdır → müsbət tag: drinks → does he?", "Choose the correct tense forms. ... the weather good when you ... tennis?": "Was the weather good when you were playing tennis? – keçmişdə davam edən hərəkət.", "Choose the sentence with the noun in the Possessive Case. 1. Tom is using his mother's car. 2. Kate's going to the party. 3. The Browns's arrival surprised me. 4. Susan is not allowed to take her sister's toys.": "1 və 4: mother's car, sister's toys (mənsubiyyət). Kate's = Kate is, Browns's ✗ (Browns').", "Choose the correct sentence in the Passive Voice. The public like the old styles.": "Passive Present Simple, cəm: The old styles are liked.", "Choose the correct form of the verb. Nobody heard him ... French.": "hear + obyekt + to-suz infinitiv: heard him speak.", "Choose the correct article. In his childhood he lived with ... grandfather, ... poor tailor.": "his grandfather → the grandfather; a poor tailor – ilk dəfə təsvir olunan peşə: a.", "Choose the correct pronoun. That is the boy ... sister came to see ... .": "whose sister – mənsubiyyət; see us – obyekt əvəzliyi.", "Choose the line of nouns in the plural.": "police, stairs, feet cəmdir. Digər sətirlərdə təkdə olan və ya sayılmayan isimlər var.", "Choose the correct form of the verb. ... German is the best way of ... it.": "Speaking German – mübtəda kimi V-ing; way of + V-ing: way of learning.", "Choose the correct interrogative sentence. (time of an action)": "Past Simple sual: did + 1-ci forma feil: When did she have breakfast?", "Choose the correct tense forms. Anna ... that she ... the visitors before.": "Anna thought (Past Simple) ki, əvvəl ziyarətçiləri görüb (Past Perfect: had seen).", "Choose the correct tense forms. She ... TV when the phone rang.": "Davam edən hərəkət (Past Continuous: was watching) fonunda qısa hərəkət (Past Simple: rang).", "Choose the correct tense forms. I ... him since 2015.": "since ilə Present Perfect işlənir: have known. know hal feilidir, Continuous olmur.", "Choose the correct tense forms. By the time we arrived, the film ... .": "by the time + Past Simple (arrived) – ondan əvvəl bitən hərəkət Past Perfect: had already started.", "Choose the correct tense forms. Tomorrow at this time we ... on the beach.": "Tomorrow at this time – gələcəkdə müəyyən anda davam edən hərəkət: Future Continuous (will be lying).", "Choose the correct tense forms. Mary ... in London for three years before she ... to Paris.": "before + Past Simple (moved) – ondan əvvəlki hərəkət Past Perfect: had lived.", "Choose the correct sentence in the Passive Voice. They will build a new school next year.": "Future Simple Passive: will be + V3 → will be built.", "Choose the correct form of the verb. The window ... by the boy yesterday.": "yesterday – Past Simple Passive: was/were + V3 → was broken.", "Choose the correct form of the verb. The report ... by the manager now.": "now – Present Continuous Passive: is/are being + V3 → is being checked.", "Choose the correct word. You ... smoke here. It is forbidden.": "Qadağa: mustn't (etmək olmaz). needn't – vacib deyil, mənası fərqlidir.", "Choose the correct word. He isn't at school. He ... have missed the bus.": "must have + V3 – keçmişə dair güclü ehtimal (məktəbdə yoxdur, deməli avtobusu qaçırıb).", "Choose the correct word. ... I borrow your pen, please?": "Nəzakətli xahiş/icazə: Could I ...?", "Choose the correct form of the verb. If it rains tomorrow, we ... at home.": "Şərt 1-ci tip: If + Present Simple, will + V. will stay.", "Choose the correct form of the verb. If I had more time, I ... learn Chinese.": "Şərt 2-ci tip: If + Past Simple, would + V (indiki zaman üçün qeyri-real şərt).", "Choose the correct form of the verb. If she had studied harder, she ... the exam.": "Şərt 3-cü tip: If + Past Perfect, would have + V3 (keçmişdə baş verməmiş hal).", "Choose the correct form of the verb. Water ... if you heat it to 100°C.": "Zero conditional: elmi fakt – hər iki hissədə Present Simple (boils).", "Choose the correct conditional sentence.": "1-ci tip şərtdə if-dən sonra will işlənmir: If I see him, I will tell him.", "Choose the correct form of the verb. Unless you ..., you will be late.": "unless = if not, özü mənfi məna verir; ondan sonra feil müsbət formada, Present Simple: Unless you hurry.", "Choose the correct preposition. She is afraid ... spiders.": "afraid OF – qorxmaq.", "Choose the correct preposition. We arrived ... the airport at midnight.": "Kiçik məkana çatmaq: arrive AT the airport (şəhərə: arrive IN).", "Choose the correct preposition. He has been living here ... 2018.": "since + başlanğıc nöqtə (2018). for + müddət olardı (for five years).", "Choose the correct preposition. The meeting is ... Monday ... 10 o'clock.": "on + gün (Monday), at + saat (10 o'clock).", "Choose the correct article. My brother plays ... piano very well.": "Musiqi alətləri ilə play + the: the piano.", "Choose the correct article. ... Alps are in Europe.": "Dağ silsilələri adlarında the işlənir: The Alps.", "Choose the correct article. She wants to be ... engineer.": "Peşə: a/an. engineer saitlə başlayır → an.", "Choose the correct pronoun. The girl ... father is a pilot is my friend.": "whose – mənsubiyyət (kimin atası): the girl whose father.", "Choose the correct pronoun. He cut ... while shaving.": "Hərəkət öz üzərinə qayıdır – qayıdış əvəzliyi himself.", "Choose the correct pronoun. There are two roads. You can take ... of them.": "İki yoldan biri: either of them. any/every üç və daha çox üçün uyğundur.", "Choose the correct pronoun. Nobody knows ... he lives.": "Dolayı sual: yer soruşulur → wher
